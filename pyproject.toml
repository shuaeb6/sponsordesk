[project]
name = "sponsordesk"
version = "0.1.0"
description = "Human-in-the-loop triage assistant for a retirement plan service desk."
requires-python = ">=3.11"
dependencies = [
    "sponsordesk-core",
    "sponsordesk-synth",
    "piiguard",
    "sponsordesk-console",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sponsordesk-core = { workspace = true }
sponsordesk-synth = { workspace = true }
piiguard = { workspace = true }
sponsordesk-console = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["S311"]  # stdlib random is intentional: synthetic data, not cryptography

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/core/src", "packages/synth/src", "packages/redact/src", "packages/console/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["faker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "slow: long-running tests",
    "live: tests that call external APIs (excluded by default in CI)",
]
