[project]
name = "sponsordesk-console"
version = "0.1.0"
description = "SponsorDesk triage engine, review API, and reviewer console."
requires-python = ">=3.11"
dependencies = [
    "sponsordesk-core",
    "sponsordesk-synth",
    "piiguard",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "scikit-learn>=1.5",
]

[project.scripts]
sponsordesk-console = "sponsordesk_console.main:run"

[tool.uv.sources]
sponsordesk-core = { workspace = true }
sponsordesk-synth = { workspace = true }
piiguard = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
