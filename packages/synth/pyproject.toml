[project]
name = "sponsordesk-synth"
version = "0.1.0"
description = "Deterministic synthetic data generator for SponsorDesk. All output is fictional."
requires-python = ">=3.11"
dependencies = [
    "sponsordesk-core",
    "faker>=30,<40",
    "typer>=0.12",
    "rich>=13.9",
]

[project.scripts]
sponsordesk-synth = "sponsordesk_synth.cli:app"

[tool.uv.sources]
sponsordesk-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
